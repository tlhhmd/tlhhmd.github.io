<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi it's Talha</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=League+Gothic&family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent: #d97706; /* The warm amber/orange from your site */
            --text-main: #1e293b;
            --text-muted: #475569;
            --title-shadow: rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            /* Your exact requested background gradients */
            background: 
                linear-gradient(135deg, rgba(255,250,232,0.88), rgba(255,252,242,0.96)),
                linear-gradient(120deg, rgba(28,63,164,0.08), transparent 52%);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        article {
            max-width: 38rem; /* Matching your .tab-copy max-width */
            width: 100%;
        }

        .kicker {
            color: var(--accent);
            font-family: "Caveat Brush", "Bradley Hand", cursive;
            font-size: 28px;
            font-weight: 700;
            line-height: 0.95;
            margin-bottom: 6px;
        }

        h1 {
            font-family: "League Gothic", Impact, sans-serif;
            font-size: clamp(40px, 12vw, 84px); /* Pushing the scale for a main site */
            line-height: 0.9;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            text-shadow: 2px 2px 0 var(--title-shadow);
        }

        .copy {
            font-family: "Inter", system-ui, sans-serif;
            color: var(--text-muted);
            font-size: 16px; /* Slightly bumped from 14px for a main landing page */
            line-height: 1.55;
            margin-bottom: 2rem;
        }

        .links {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        a {
            font-family: "League Gothic", sans-serif;
            font-size: 24px;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--text-main);
            border-bottom: 2px solid var(--accent);
            display: inline-block;
            width: fit-content;
            transition: all 0.2s ease;
        }

        a:hover {
            background: var(--accent);
            color: white;
            padding: 0 8px;
            transform: translateX(5px);
        }

        .external-arrow {
            font-family: sans-serif;
            font-size: 18px;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <article>
        <div class="kicker">Helping you make sense of your stuff</div>
        <h1>Hi it's Talha</h1>
        
        <div class="copy">
            Loren ipsum boopity boop I'll write this up later.
        </div>

        <div class="links">
            <a href="https://www.linkedin.com/in/ahmadtalha/" target="_blank">
                LinkedIn <span class="external-arrow">↗</span>
            </a>
            <a href="https://www.talha.foo/free-exercise-graph/">
                Free Exercise Graph <span class="external-arrow">↳</span>
            </a>
        </div>
    </article>

</body>
</html>
